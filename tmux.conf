unbind C-b
set -g prefix C-s
# set-option -g default-shell /usr/local/bin/fish
bind C-s send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "~/tmux.conf reloaded"


bind-key C-j choose-tree

bind c new-window -c '#{pane_current_path}'
bind-key - split-window -v -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"

# Prefix + hjkl to select panes (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# escape timing is the worst
set -s escape-time 0

# I'm a human, the world is one indexed
set -g base-index 1
setw -g pane-base-index 1

# Automatically name windows after the active pane's title
set-window-option -g automatic-rename on
set -g automatic-rename-format '#{pane_title}'

# improve colors
set -g default-terminal 'screen-256color'
# Ghostty supports 24-bit color, but tmux 3.2 doesn't know that from terminfo;
# without this, hex colors get squashed into the 256-color palette.
set -as terminal-features ',xterm-ghostty:RGB'

# This actually looks pretty bad in dark mode rn
# set -g status-fg 'white'
# set -g status-bg 'magenta'

# remove administrative debris (session name, hostname, time) in status bar
set -g status-left ''
set -g status-right '#(tmux-host-id)'

# Give each window its own color by index, using the terminal's own ANSI
# palette (red, green, yellow, blue, magenta, cyan) so it matches whatever
# theme the terminal has. Every window is a solid block, like a terminal color
# test; the current one uses the bright variant, bold, with ▶ ◀ markers.
set -g @window_color '#{?#{==:#{e|%:#{window_index},6},1},red,#{?#{==:#{e|%:#{window_index},6},2},green,#{?#{==:#{e|%:#{window_index},6},3},yellow,#{?#{==:#{e|%:#{window_index},6},4},blue,#{?#{==:#{e|%:#{window_index},6},5},magenta,cyan}}}}}'
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g window-status-separator ''
set -g window-status-format '#[fg=black,bg=#{E:@window_color}]  #I:#W  #[default]'
set -g window-status-current-format '#[fg=black,bg=bright#{E:@window_color},bold]▶ #I:#W ◀#[default]'

# TPM https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'

set -g pane-active-border-style "fg=#f38ba8"
set -g pane-border-style "fg=#45475a"
set -g pane-border-lines heavy

# Show each pane's title in its border
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# Slightly darker windows for inactive.
set -g window-style "bg=#181825"
set -g window-active-style "bg=#232136"

run '~/.tmux/plugins/tpm/tpm'
